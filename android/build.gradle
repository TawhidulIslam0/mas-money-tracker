allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Preserve AGP 7 defaults for older Flutter plugins that do not declare these settings.
subprojects { subproject ->
    subproject.afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library") || project.plugins.hasPlugin("com.android.application")) {
            project.android {
                compileSdkVersion 36
                buildFeatures.buildConfig = true
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }

            if (project.android.namespace == null) {
                def manifestFile = project.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifestPackage = new groovy.xml.XmlSlurper().parse(manifestFile).@package.text()
                    if (manifestPackage) {
                        project.android.namespace = manifestPackage
                    }
                }
            }

            if (project.plugins.hasPlugin("org.jetbrains.kotlin.android")) {
                project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                    kotlinOptions.jvmTarget = "17"
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}